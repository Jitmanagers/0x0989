    <style>
        :root {
            --bg-primary: #0A0A0A;
            --bg-secondary: #1E1E1E;
            --bg-card: #252525;
            --text-primary: #E0E0E0;
            --text-secondary: #B0B0B0;
            --accent-cyan: #00FFFF;
            --accent-purple: #BF00FF;
            --accent-pink: #FF00C8;
            --success: #00FF88;
            --warning: #FFAA00;
            --danger: #FF4444;
            --border-radius: 8px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            color: var(--accent-cyan);
            font-size: 2rem;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .language-selector {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 8px 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .language-selector:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 25px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: var(--box-shadow);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
        }

        .stat-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--accent-cyan);
            opacity: 0.3;
        }

        /* Victim Table */
        .victims-section {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .filters {
            display: flex;
            gap: 15px;
        }

        .filter-input {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 8px 15px;
            color: var(--text-primary);
            width: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .victim-id {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .windows-icon {
            color: var(--accent-cyan);
        }

        .ip-location {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .os-icon {
            color: var(--accent-cyan);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-right: 5px;
            margin-bottom: 3px;
        }

        .badge-passwords {
            background: rgba(0, 255, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .badge-cookies {
            background: rgba(191, 0, 255, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(191, 0, 255, 0.3);
        }

        .social-icons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: var(--accent-cyan);
            color: var(--bg-primary);
        }

        .last-seen {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .controls {
                width: 100%;
                justify-content: space-between;
            }

            .filters {
                flex-wrap: wrap;
            }

            .filter-input {
                width: 100%;
            }
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        /* Loading indicator */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
        
        /* Error message */
        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            border-radius: var(--border-radius);
            margin: 20px 0;
        }
    </style>
</head>

        const socialPlatforms = [

        // Show error message

            const errorMsg = document.getElementById('errorMessage');
            const t = translations[currentLanguage];
            errorMsg.textContent = message || t.errorOccurred;
            errorMsg.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Show loading indicator
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.querySelector('table').style.display = 'none';
        }

        // Hide loading indicator
        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.querySelector('table').style.display = 'table';
        }

        // Format last seen time (simple implementation)
        function formatLastSeen(lastSeen) {
            if (!lastSeen) return 'Never';
            
            const now = new Date();
            const lastSeenDate = new Date(lastSeen);
            const diffInSeconds = Math.floor((now - lastSeenDate) / 1000);
            
            if (diffInSeconds < 60) {
                return `${diffInSeconds} seconds ago`;
            } else if (diffInSeconds < 3600) {
                const minutes = Math.floor(diffInSeconds / 60);
                return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            } else if (diffInSeconds < 86400) {
                const hours = Math.floor(diffInSeconds / 3600);
                return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else {
                const days = Math.floor(diffInSeconds / 86400);
                return `${days} day${days > 1 ? 's' : ''} ago`;
            }
        }

        // Calculate statistics from victims data
        function calculateStats(victims) {
            const totalVictims = victims.length;
            const totalPasswords = victims.reduce((sum, victim) => sum + victim.passwords_count, 0);
            const totalCookies = victims.reduce((sum, victim) => sum + victim.cookies_count, 0);
            const totalSocial = victims.reduce((sum, victim) => sum + victim.social_accounts.length, 0);

            document.getElementById('totalVictims').textContent = totalVictims;
            document.getElementById('totalPasswords').textContent = totalPasswords.toLocaleString();
            document.getElementById('totalCookies').textContent = totalCookies.toLocaleString();
            document.getElementById('totalSocial').textContent = totalSocial;
        }

        // Render victims table
        function renderVictimsTable(victimsToRender) {
            const tbody = document.getElementById('victimsTableBody');
            tbody.innerHTML = '';

            victimsToRender.forEach(victim => {
                const tr = document.createElement('tr');

                // Get social media icons with tooltips
                const socialIconsHtml = victim.social_accounts.map(platform => {
                    const platformInfo = socialPlatforms.find(p => p.name === platform);
                    if (platformInfo) {
                        const tooltipText = translations[currentLanguage][platformInfo.tooltip];
                        return `
                            <div class="tooltip">
                                <div class="social-icon">
                                    <i class="${platformInfo.icon}"></i>
                                </div>
                                <span class="tooltiptext">${tooltipText}</span>
                            </div>
                        `;
                    }
                    return '';
                }).join('');

                tr.innerHTML = `
                    <td>
                        <div class="victim-id">
                            <i class="fab fa-windows windows-icon"></i>
                            ${victim.computer_name}
                        </div>
                    </td>
                    <td>
                        <div class="ip-location">
                            <span class="fi fi-${victim.country_code.toLowerCase()}"></span>
                            ${victim.ip_address}
                        </div>
                    </td>
                    <td>
                        <div class="os-info">
                            <i class="fab fa-windows os-icon"></i>
                            ${victim.os_version}
                        </div>
                    </td>
                    <td>
                        <span class="badge badge-passwords">${victim.passwords_count}</span>
                    </td>
                    <td>
                        <span class="badge badge-cookies">${victim.cookies_count}</span>
                    </td>
                    <td>
                        <div class="social-icons">
                            ${socialIconsHtml}
                        </div>
                    </td>
                    <td class="last-seen">${formatLastSeen(victim.last_seen)}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        // Fetch victims from API
        async function fetchVictims() {
            showLoading();
            hideError();
            
            try {
                const response = await fetch('/api/victims');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                renderVictimsTable(data.victims);
                calculateStats(data.victims);
                hideLoading();
            } catch (error) {
                console.error('Error fetching victims:', error);
                showError();
                hideLoading();
            }
        }
